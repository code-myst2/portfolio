<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>প্রজেক্ট — এডমিন প্যানেল</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ===== থিম টোকেন — Next.js স্টাইল ব্ল্যাক থিম ===== */
:root {
  --bg: #000000;
  --bg-elevated: #0a0a0a;
  --bg-card: #0d0d0d;
  --border: #232323;
  --border-soft: #1a1a1a;
  --text: #ededed;
  --text-muted: #8a8a8a;
  --text-faint: #5c5c5c;
  --accent: #3291ff;
  --accent-soft: rgba(50, 145, 255, 0.14);
  --danger: #f5455c;
  --danger-soft: rgba(245, 69, 92, 0.12);
  --success: #46c76b;
  --success-soft: rgba(70, 199, 107, 0.12);
  --warn: #f5a623;
  --warn-soft: rgba(245, 166, 35, 0.12);
  --radius: 10px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  padding-bottom: 110px;
}

a { color: inherit; text-decoration: none; }

/* ===== টপবার ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-soft);
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .brand {
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar .brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}
.topbar .actions { display: flex; align-items: center; gap: 10px; }

/* ===== কন্টেন্ট এরিয়া ===== */
.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: 32px 20px 40px;
}
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.page-header h1 {
  font-size: 22px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.02em;
}
.page-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

/* ===== ফ্লোটিং ডক ন্যাভ ===== */
.dock-wrap {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  padding: 0 10px;
  width: 100%;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.dock {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(15, 15, 15, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 8px 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.03);
  max-width: 96vw;
}
.dock a {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: var(--text-muted);
  transition: all .2s ease;
}
.dock a:hover { color: var(--text); background: rgba(255,255,255,0.08); transform: translateY(-2px); }
.dock a.active {
  background: #ffffff;
  color: #000000;
  box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
}
.dock a svg { width: 19px; height: 19px; flex-shrink: 0; }
.dock a .badge-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== বাটন ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  padding: 9px 16px;
  border-radius: var(--radius);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s ease;
}
.btn:hover { border-color: #3a3a3a; background: #141414; }
.btn-primary { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 600; }
.btn-primary:hover { background: #e4e4e4; }
.btn-danger { color: var(--danger); border-color: var(--danger-soft); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { padding: 6px 12px; font-size: 12.5px; }
.btn-icon { padding: 8px; border-radius: 8px; }

/* ===== কার্ড / গ্রিড ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color .2s ease;
}
.card:hover { border-color: #2c2c2c; }
.card-cover { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border-soft); }
.card h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
.card p { margin: 0 0 12px; color: var(--text-muted); font-size: 13px; line-height: 1.5; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card-actions { display: flex; gap: 6px; }
.card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-soft); }

.empty-state {
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
  grid-column: 1 / -1;
}
.empty-state h3 { color: var(--text); font-weight: 600; margin-bottom: 6px; }

/* ===== ব্যাজ ===== */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.badge-live { background: var(--success-soft); color: var(--success); }
.badge-draft { background: var(--warn-soft); color: var(--warn); }

/* ===== ফর্ম ===== */
label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
input, textarea, select {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
.field { margin-bottom: 14px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .field-row { grid-template-columns: 1fr; } }
.upload-preview { margin-top: 8px; display: flex; align-items: center; gap: 10px; background: #111; padding: 8px; border-radius: 8px; }
.upload-preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }

/* ===== মোডাল ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 16px;
}
.modal {
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 520px;
  max-height: 88vh;
  display: flex; flex-direction: column;
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border-soft); }
.modal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 16px 20px; border-top: 1px solid var(--border-soft); display: flex; justify-content: flex-end; gap: 10px; }

/* ===== টোস্ট ===== */
.toast-stack { position: fixed; bottom: 100px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: #fff; color: #000; padding: 11px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
}

.spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.center-loader { display: flex; align-items: center; justify-content: center; padding: 80px 0; }

</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> এডমিন প্যানেল</div>
    <div class="actions">
      <button class="btn btn-sm" id="logoutBtn">
        <i data-lucide="log-out" style="width:14px;height:14px;"></i> লগ আউট
      </button>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>প্রজেক্টসমূহ</h1>
        <p class="page-sub" id="countLabel">লোড হচ্ছে...</p>
      </div>
      <button class="btn btn-primary" id="newBtn">
        <i data-lucide="plus" style="width:16px;height:16px;"></i> নতুন প্রজেক্ট
      </button>
    </div>

    <div id="listArea">
      <div class="center-loader"><span class="spinner"></span></div>
    </div>
  </div>

  <!-- ===== মোডাল ===== -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">নতুন প্রজেক্ট</h3>
        <button class="btn btn-icon btn-sm" id="closeModal"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>শিরোনাম *</label>
          <input id="f_title" placeholder="প্রজেক্টের নাম লিখুন" />
        </div>
        <div class="field">
          <label>বিবরণ</label>
          <textarea id="f_description" placeholder="প্রজেক্টের বিস্তারিত তথ্য..."></textarea>
        </div>
        <div class="field">
          <label>প্রযুক্তি (কমা দিয়ে আলাদা করুন)</label>
          <input id="f_tech" placeholder="React, Node.js, Firebase" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>লাইভ / রিপো লিংক</label>
            <input id="f_link" placeholder="https://..." />
          </div>
          <div class="field">
            <label>অবস্থা</label>
            <select id="f_status">
              <option value="সম্পন্ন">সম্পন্ন</option>
              <option value="চলমান">চলমান</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>স্ক্রিনশট / কভার ছবি</label>
          <input type="file" id="f_cover" accept="image/*" />
          <div class="upload-preview" id="coverPreview" style="display:none;">
            <img id="coverPreviewImg" src="" alt="" />
            <span id="coverStatus" style="font-size:12px;color:var(--text-muted);"></span>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="cancelBtn">বাতিল</button>
        <button class="btn btn-primary" id="saveBtn">সংরক্ষণ করুন</button>
      </div>
    </div>
  </div>

  <!-- ===== মুছে ফেলার মোডাল ===== -->
  <div class="modal-overlay" id="deleteModalOverlay" style="display:none;">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-head">
        <h3 style="color:var(--danger);">প্রজেক্ট মুছে ফেলার নিশ্চয়তা</h3>
      </div>
      <div class="modal-body">
        <p style="margin:0; font-size:14px; color:var(--text-muted);">আপনি কি নিশ্চিত যে এই প্রজেক্টটি মুছে ফেলতে চান?</p>
      </div>
      <div class="modal-foot">
        <button class="btn" id="cancelDeleteBtn">বাতিল</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">হ্যাঁ, মুছে ফেলুন</button>
      </div>
    </div>
  </div>

  <!-- ===== ফ্লোটিং ডক ন্যাভ ===== -->
  <div class="dock-wrap">
    <nav class="dock">
      <a href="admin.html"><i data-lucide="layout-dashboard"></i></a>
      <a href="blog.html"><i data-lucide="file-text"></i></a>
      <a href="project.html" class="active"><i data-lucide="folder-kanban"></i></a>
      <a href="inbox.html"><i data-lucide="message-square"></i><span id="inboxBadge" class="badge-dot" style="display:none;"></span></a>
      <a href="analysis.html"><i data-lucide="bar-chart-3"></i></a>
      <a href="setting.html"><i data-lucide="settings"></i></a>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    /* ---- Firebase ইনিশিয়ালাইজেশন ---- */
    const firebaseConfig = {
      apiKey: "AIzaSyBN6M3FTTvy6V2JmrqbiYOZyaOM88g5Rvc",
      authDomain: "test-pro-portfolio.firebaseapp.com",
      projectId: "test-pro-portfolio",
      storageBucket: "test-pro-portfolio.firebasestorage.app",
      messagingSenderId: "368597108521",
      appId: "1:368597108521:web:ea84f26576e757ee3c5938",
      measurementId: "G-70622PC5Q4",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const cloudinaryConfig = {
      cloudName: "dak8rgroe",
      uploadPreset: "portfolio",
    };

    function guardPage() {
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          // window.location.href = "login.html";
        }
      });
    }

    async function logout() {
      await signOut(auth);
      window.location.href = "login.html";
    }

    function showToast(text) {
      let stack = document.querySelector(".toast-stack");
      if (!stack) {
        stack = document.createElement("div");
        stack.className = "toast-stack";
        document.body.appendChild(stack);
      }
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = `<i data-lucide="check-circle-2" style="width:16px;height:16px;color:var(--success);"></i><span>${text}</span>`;
      stack.appendChild(el);
      lucide.createIcons();
      setTimeout(() => el.remove(), 3500);
    }

    async function uploadToCloudinary(file, onProgress) {
      const url = `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", cloudinaryConfig.uploadPreset);
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);
        xhr.upload.onprogress = (e) => {
          if (onProgress && e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
        };
        xhr.onload = () => {
          try {
            const data = JSON.parse(xhr.responseText);
            if (data.secure_url) resolve(data.secure_url);
            else reject(new Error(data.error?.message || "আপলোড ব্যর্থ হয়েছে"));
          } catch (err) { reject(err); }
        };
        xhr.onerror = () => reject(new Error("নেটওয়ার্ক সমস্যা — আপলোড ব্যর্থ হয়েছে"));
        xhr.send(formData);
      });
    }

    const COLLECTION = "projects";
    let items = [];
    let editingId = null;
    let deleteTargetId = null;
    let pendingCoverUrl = "";

    const listArea = document.getElementById("listArea");
    const countLabel = document.getElementById("countLabel");
    const overlay = document.getElementById("modalOverlay");
    const deleteModalOverlay = document.getElementById("deleteModalOverlay");

    onSnapshot(collection(db, COLLECTION), (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      render();
    }, (err) => {
      listArea.innerHTML = `<div class="empty-state"><h3>ডেটা লোড করা যায়নি</h3><p>${err.message}</p></div>`;
    });

    function render() {
      countLabel.textContent = `মোট ${items.length} টি প্রজেক্ট`;
      if (items.length === 0) {
        listArea.innerHTML = `<div class="empty-state"><h3>এখনো কোনো প্রজেক্ট নেই</h3><p>নতুন প্রজেক্ট তৈরি করতে "নতুন প্রজেক্ট" বাটনে ক্লিক করুন।</p></div>`;
        return;
      }
      listArea.innerHTML = `<div class="grid">${items.map(cardHtml).join("")}</div>`;
      lucide.createIcons();
    }

    function cardHtml(it) {
      const statusClass = it.status === "সম্পন্ন" ? "badge-live" : "badge-draft";
      const techTags = (it.tech || "").split(",").map((t) => t.trim()).filter(Boolean);
      return `
        <div class="card">
          <div>
            ${it.coverUrl ? `<img src="${escapeHtml(it.coverUrl)}" class="card-cover" alt="Cover" />` : ""}
            <div class="card-top">
              <h3>${escapeHtml(it.title || "শিরোনামহীন")}</h3>
              <div class="card-actions">
                <button class="btn btn-icon btn-sm" data-edit="${it.id}"><i data-lucide="pencil" style="width:14px;height:14px;"></i></button>
                <button class="btn btn-icon btn-sm btn-danger" data-delete="${it.id}"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button>
              </div>
            </div>
            ${it.description ? `<p>${escapeHtml(it.description)}</p>` : ""}
          </div>
          <div class="card-meta">
            <span class="badge ${statusClass}">${it.status || "চলমান"}</span>
            ${techTags.length ? `<span style="font-size:11px;color:var(--text-faint);">${escapeHtml(techTags.join(" · "))}</span>` : ""}
          </div>
        </div>`;
    }

    function escapeHtml(s = "") {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    guardPage();
    lucide.createIcons();
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("newBtn").addEventListener("click", () => openModal(null));
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("cancelDeleteBtn").addEventListener("click", () => deleteModalOverlay.style.display = "none");

    listArea.addEventListener("click", (e) => {
      const editBtn = e.target.closest("[data-edit]");
      const delBtn = e.target.closest("[data-delete]");
      if (editBtn) openModal(items.find((i) => i.id === editBtn.dataset.edit));
      if (delBtn) {
        deleteTargetId = delBtn.dataset.delete;
        deleteModalOverlay.style.display = "flex";
      }
    });

    document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
      if (!deleteTargetId) return;
      try {
        await deleteDoc(doc(db, COLLECTION, deleteTargetId));
        showToast("প্রজেক্ট মুছে ফেলা হয়েছে");
      } catch (err) {
        showToast("মুছে ফেলা সম্ভব হয়নি");
      } finally {
        deleteModalOverlay.style.display = "none";
      }
    });

    function openModal(item) {
