<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>এনালিটিক্স — এডমিন প্যানেল</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ===== থিম টোকেন — Next.js স্টাইল ব্ল্যাক থিম ===== */
:root {
  --bg: #000000;
  --bg-elevated: #0a0a0a;
  --bg-card: #0d0d0d;
  --border: #232323;
  --border-soft: #1a1a1a;
  --text: #ededed;
  --text-muted: #8a8a8a;
  --text-faint: #5c5c5c;
  --accent: #3291ff;
  --danger: #f5455c;
  --success: #46c76b;
  --radius: 10px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  padding-bottom: 110px;
}

a { color: inherit; text-decoration: none; }

/* ===== টপবার ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-soft);
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .brand {
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar .brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

/* ===== কন্টেন্ট এরিয়া ===== */
.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: 32px 20px 40px;
}
.page-header h1 { font-size: 22px; font-weight: 600; margin: 0; }
.page-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

/* ===== ফ্লোটিং ডক ন্যাভ ===== */
.dock-wrap {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  padding: 0 10px;
  width: 100%;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.dock {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(15, 15, 15, 0.88);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 8px 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
}
.dock a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: var(--text-muted);
  transition: all .2s ease;
}
.dock a:hover { color: var(--text); background: rgba(255,255,255,0.08); }
.dock a.active { background: #ffffff; color: #000000; }
.dock a svg { width: 19px; height: 19px; }

/* ===== বাটন ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
}

/* ===== স্ট্যাট কার্ড ===== */
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-top: 2px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: 18px;
}
.stat-card .num { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.stat-card .lbl { color: var(--text-muted); font-size: 12.5px; margin-top: 4px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }

/* ===== এনালিটিক্স কার্ডস ===== */
.chart-card { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; margin-top: 20px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-soft); }
.table th { color: var(--text-muted); font-weight: 500; font-size: 12px; }

.empty-state {
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
}
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> এডমিন প্যানেল</div>
    <div class="actions">
      <button class="btn" id="logoutBtn"><i data-lucide="log-out" style="width:14px;height:14px;"></i> লগ আউট</button>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <h1>ভিজিটর এনালিটিক্স</h1>
      <p class="page-sub">গত ১৪ দিনের ওয়েবসাইট ট্রাফিক রিপোর্ট</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="num" id="statTotal">—</div><div class="lbl">মোট ভিজিট</div></div>
      <div class="stat-card"><div class="num" id="statUnique">—</div><div class="lbl">ইউনিক ভিজিটর</div></div>
      <div class="stat-card"><div class="num" id="statToday">—</div><div class="lbl">আজকের ভিজিট</div></div>
      <div class="stat-card"><div class="num" id="statTopPage">—</div><div class="lbl">জনপ্রিয় পেজ</div></div>
    </div>

    <div class="chart-card">
      <h3 style="margin:0 0 14px;font-size:14px;font-weight:600;">দৈনিক ভিজিট (গত ১৪ দিন)</h3>
      <canvas id="visitsChart" height="90"></canvas>
    </div>

    <div class="chart-card">
      <h3 style="margin:0 0 14px;font-size:14px;font-weight:600;">সাম্প্রতিক ভিজিট ট্রাফিক</h3>
      <div style="overflow-x:auto;">
        <table class="table" id="eventsTable">
          <thead><tr><th>পেজ</th><th>রেফারার</th><th>সময়</th></tr></thead>
          <tbody><tr><td colspan="3" style="text-align:center;"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="empty-state" id="noDataNote" style="display:none;margin-top:16px;">
      <h3>এখনো কোনো ভিজিট ট্র্যাক হয়নি</h3>
      <p>আপনার পোর্টফোলিও সাইটে ভিজিটর আসলে এখানে লাইভ ডেটা দেখাবে।</p>
    </div>
  </div>

  <div class="dock-wrap">
    <nav class="dock">
      <a href="admin.html"><i data-lucide="layout-dashboard"></i></a>
      <a href="blog.html"><i data-lucide="file-text"></i></a>
      <a href="project.html"><i data-lucide="folder-kanban"></i></a>
      <a href="inbox.html"><i data-lucide="message-square"></i></a>
      <a href="analysis.html" class="active"><i data-lucide="bar-chart-3"></i></a>
      <a href="setting.html"><i data-lucide="settings"></i></a>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBN6M3FTTvy6V2JmrqbiYOZyaOM88g5Rvc",
      authDomain: "test-pro-portfolio.firebaseapp.com",
      projectId: "test-pro-portfolio",
      storageBucket: "test-pro-portfolio.firebasestorage.app",
      messagingSenderId: "368597108521",
      appId: "1:368597108521:web:ea84f26576e757ee3c5938",
      measurementId: "G-70622PC5Q4",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // window.location.href = "login.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    lucide.createIcons();

    try {
      const snap = await getDocs(collection(db, "analytics_events"));
      let events = snap.docs.map((d) => d.data());
      
      events.sort((a, b) => (b.ts?.seconds || 0) - (a.ts?.seconds || 0));

      if (events.length === 0) {
        document.getElementById("noDataNote").style.display = "block";
        document.querySelector("#eventsTable tbody").innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--text-muted);">কোনো ভিজিট ডেটা নেই</td></tr>`;
      } else {
        renderStats(events);
        renderChart(events);
        renderTable(events);
      }
    } catch (err) {
      console.error(err);
      document.querySelector("#eventsTable tbody").innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--danger);">ডেটা লোড করতে সমস্যা হয়েছে</td></tr>`;
    }

    function renderStats(events) {
      document.getElementById("statTotal").textContent = events.length;
      document.getElementById("statUnique").textContent = new Set(events.map((e) => e.visitorId)).size;
      
      const todayStr = new Date().toDateString();
      const todayCount = events.filter((e) => e.ts?.toDate && e.ts.toDate().toDateString() === todayStr).length;
      document.getElementById("statToday").textContent = todayCount;

      const pageCounts = {};
      events.forEach((e) => (pageCounts[e.page || "/"] = (pageCounts[e.page || "/"] || 0) + 1));
      const topPage = Object.entries(pageCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || "/";
      document.getElementById("statTopPage").textContent = topPage;
      document.getElementById("statTopPage").style.fontSize = "16px";
    }

    function renderChart(events) {
      const days = [];
      const counts = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d.toLocaleDateString("bn-BD", { day: "2-digit", month: "2-digit" }));
        const dayStr = d.toDateString();
        counts.push(events.filter((e) => e.ts?.toDate && e.ts.toDate().toDateString() === dayStr).length);
      }

      new Chart(document.getElementById("visitsChart"), {
        type: "bar",
        data: {
          labels: days,
          datasets: [{ label: "ভিজিট", data: counts, backgroundColor: "#3291ff", borderRadius: 4 }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#8a8a8a" }, grid: { display: false } },
            y: { ticks: { color: "#8a8a8a", stepSize: 1 }, grid: { color: "#1a1a1a" } },
          },
        },
      });
    }

    function renderTable(events) {
      const rows = events.slice(0, 20).map((e) => `
        <tr>
          <td>${escapeHtml(e.page || "/")}</td>
          <td style="color:var(--text-muted);">${escapeHtml(e.referrer || "সরাসরি")}</td>
          <td style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-muted);">${e.ts?.toDate ? e.ts.toDate().toLocaleString("bn-BD") : "—"}</td>
        </tr>`).join("");
      document.querySelector("#eventsTable tbody").innerHTML = rows;
    }

    function escapeHtml(s = "") {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
