<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ব্লগ — এডমিন প্যানেল</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    /* ===== থিম টোকেন — Next.js ডার্ক থিম ===== */
    :root {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --bg-card: #0d0d0d;
      --border: #232323;
      --border-soft: #1a1a1a;
      --text: #ededed;
      --text-muted: #8a8a8a;
      --text-faint: #5c5c5c;
      --accent: #3291ff;
      --accent-soft: rgba(50, 145, 255, 0.14);
      --danger: #f5455c;
      --danger-soft: rgba(245, 69, 92, 0.12);
      --success: #46c76b;
      --success-soft: rgba(70, 199, 107, 0.12);
      --warn: #f5a623;
      --warn-soft: rgba(245, 166, 35, 0.12);
      --radius: 10px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      padding-bottom: 110px; /* ফ্লোটিং ডকের জন্য জায়গা */
    }

    a { color: inherit; text-decoration: none; }

    /* ===== টপবার ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-soft);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar .brand {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar .brand .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .topbar .actions { display: flex; align-items: center; gap: 10px; }

    /* ===== কন্টেন্ট এরিয়া ===== */
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .page-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

    /* ===== ফিল্টার ও সার্চ বার ===== */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }
    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }
    .search-box input {
      padding-left: 36px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-elevated);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border-soft);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ===== ফ্লোটিং ডক ন্যাভ ===== */
    .dock-wrap {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 0 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 15, 15, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.03);
      max-width: 96vw;
    }
    .dock a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: var(--text-muted);
      transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dock a:hover { color: var(--text); background: rgba(255,255,255,0.08); transform: translateY(-2px); }
    .dock a.active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }
    .dock a svg { width: 19px; height: 19px; flex-shrink: 0; }
    
    .dock a .badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tooltip on Dock Hover */
    .dock a::after {
      content: attr(data-tooltip);
      position: absolute;
      top: -36px;
      background: #1e1e1e;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      transform: translateY(4px);
      border: 1px solid var(--border);
    }
    .dock a:hover::after {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== বাটন ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      padding: 9px 16px;
      border-radius: var(--radius);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn:hover { border-color: #3a3a3a; background: #141414; }
    .btn-primary { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 600; }
    .btn-primary:hover { background: #e4e4e4; }
    .btn-danger { color: var(--danger); border-color: var(--danger-soft); }
    .btn-danger:hover { background: var(--danger-soft); }
    .btn-sm { padding: 6px 12px; font-size: 12.5px; }
    .btn-icon { padding: 8px; border-radius: 8px; }

    /* ===== গ্রিড ও ব্লগ কার্ড ===== */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color .2s ease, transform .2s ease;
    }
    .card:hover { border-color: #2c2c2c; transform: translateY(-2px); }
    
    .card-cover {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid var(--border-soft);
      background: #121212;
    }
    
    .card h3 { 
      margin: 0 0 8px; 
      font-size: 16px; 
      font-weight: 600; 
      letter-spacing: -0.01em; 
      line-height: 1.35;
    }
    .card p { margin: 0 0 14px; color: var(--text-muted); font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card-actions { display: flex; gap: 6px; }
    .card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-soft); }

    .empty-state {
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state h3 { color: var(--text); font-weight: 600; margin-bottom: 6px; }

    /* ===== ব্যাজ ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-live { background: var(--success-soft); color: var(--success); }
    .badge-draft { background: var(--warn-soft); color: var(--warn); }

    /* ===== ফর্ম ===== */
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    input, textarea, select {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s ease;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea { min-height: 100px; resize: vertical; }
    .field { margin-bottom: 16px; }
    
    .upload-preview { 
      margin-top: 10px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      background: #111; 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: 1px solid var(--border); 
    }
    .upload-preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }

    /* ===== মোডাল ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%; max-width: 520px;
      max-height: 88vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--border-soft);
    }
    .modal-head h3 { margin: 0; font-size: 16.5px; font-weight: 600; }
    .modal-body { padding: 20px; overflow-y: auto; }
    .modal-foot { padding: 16px 20px; border-top: 1px solid var(--border-soft); display: flex; justify-content: flex-end; gap: 10px; }

    /* ===== টোস্ট নোটিফিকেশন ===== */
    .toast-stack { position: fixed; bottom: 100px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: #ffffff; color: #000000; padding: 11px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: toastIn .2s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== লোডার ===== */
    .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center-loader { display: flex; align-items: center; justify-content: center; padding: 80px 0; }
  </style>
</head>
<body>

  <!-- টপবার -->
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span> এডমিন প্যানেল
    </div>
    <div class="actions">
      <button class="btn btn-sm" id="logoutBtn">
        <i data-lucide="log-out" style="width:14px;height:14px;"></i> লগ আউট
      </button>
    </div>
  </div>

  <!-- মূল কন্টেন্ট -->
  <div class="page">
    <div class="page-header">
      <div>
        <h1>ব্লগ পোস্টসমূহ</h1>
        <p class="page-sub" id="countLabel">ডেটা লোড হচ্ছে...</p>
      </div>
      <button class="btn btn-primary" id="newBtn">
        <i data-lucide="plus" style="width:16px;height:16px;"></i> নতুন পোস্ট
      </button>
    </div>

    <!-- সার্চ ও ফিল্টার বার -->
    <div class="filter-bar">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="পোস্টের শিরোনাম বা ট্যাগ খুঁজুন..." />
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">সবগুলো</button>
        <button class="tab-btn" data-filter="প্রকাশিত">প্রকাশিত</button>
        <button class="tab-btn" data-filter="খসড়া">খসড়া</button>
      </div>
    </div>

    <!-- লিস্ট এরিয়া -->
    <div id="listArea">
      <div class="center-loader"><span class="spinner"></span></div>

  </div>

  <!-- ===== ক্রিয়েট/এডিট মোডাল ===== -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">নতুন ব্লগ পোস্ট</h3>
        <button class="btn btn-icon btn-sm" id="closeModal"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>শিরোনাম *</label>
          <input id="f_title" placeholder="পোস্টের আকর্ষনীয় শিরোনাম লিখুন" />
        </div>
        <div class="field">
          <label>সংক্ষিপ্ত বিবরণ / সারসংক্ষেপ</label>
          <textarea id="f_excerpt" placeholder="পোস্টের একটি সংক্ষিপ্ত বিবরণ..."></textarea>
        </div>
        <div class="field">
          <label>ট্যাগ (কমা দিয়ে আলাদা করুন)</label>
          <input id="f_tags" placeholder="যেমন: Tech, React, Design" />
        </div>
        <div class="field">
          <label>অবস্থা (Status)</label>
          <select id="f_status">
            <option value="প্রকাশিত">প্রকাশিত</option>
            <option value="খসড়া">খসড়া</option>
          </select>
        </div>
        <div class="field">
          <label>কভার ছবি</label>
          <input type="file" id="f_cover" accept="image/*" />
          <div class="upload-preview" id="coverPreview" style="display:none;">
            <img id="coverPreviewImg" src="" alt="Cover Preview" />
            <span id="coverStatus" style="font-size:12px;color:var(--text-muted);"></span>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="cancelBtn">বাতিল</button>
        <button class="btn btn-primary" id="saveBtn">সংরক্ষণ করুন</button>
      </div>
    </div>
  </div>

  <!-- ===== মুছে ফেলার মোডাল ===== -->
  <div class="modal-overlay" id="deleteModalOverlay" style="display:none;">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-head">
        <h3 style="color:var(--danger);">পোস্ট মুছে ফেলার নিশ্চয়তা</h3>
      </div>
      <div class="modal-body">
        <p style="margin:0; font-size:14px; color:var(--text-muted);">আপনি কি নিশ্চিত যে এই ব্লগ পোস্টটি মুছে ফেলতে চান? এই কাজটি আর পূর্বাবস্থায় ফেরানো যাবে না।</p>
      </div>
      <div class="modal-foot">
        <button class="btn" id="cancelDeleteBtn">বাতিল</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">হ্যাঁ, মুছে ফেলুন</button>
      </div>
    </div>
  </div>

  <!-- ===== ফ্লোটিং ডক ন্যাভিগেশন ===== -->
  <div class="dock-wrap">
    <nav class="dock">
      <a href="admin.html" data-tooltip="ড্যাশবোর্ড">
        <i data-lucide="layout-dashboard"></i>
      </a>
      <a href="blog.html" class="active" data-tooltip="ব্লগ">
        <i data-lucide="file-text"></i>
      </a>
      <a href="project.html" data-tooltip="প্রজেক্ট">
        <i data-lucide="folder-kanban"></i>

      <a href="inbox.html" data-tooltip="ইনবক্স">
        <i data-lucide="message-square"></i>
        <span id="inboxBadge" class="badge-dot" style="display:none;"></span>
      </a>
      <a href="analysis.html" data-tooltip="এনালিটিক্স">
        <i data-lucide="bar-chart-3"></i>
      </a>
      <a href="setting.html" data-tooltip="সেটিংস">
        <i data-lucide="settings"></i>
      </a>
    </nav>
  </div>

  <!-- Firebase & Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    /* ---- ফায়ারবেস কনফিগ ---- */
    const firebaseConfig = {
      apiKey: "AIzaSyBN6M3FTTvy6V2JmrqbiYOZyaOM88g5Rvc",
      authDomain: "test-pro-portfolio.firebaseapp.com",
      projectId: "test-pro-portfolio",
      storageBucket: "test-pro-portfolio.firebasestorage.app",
      messagingSenderId: "368597108521",
      appId: "1:368597108521:web:ea84f26576e757ee3c5938",
      measurementId: "G-70622PC5Q4",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    /* ---- Cloudinary কনফিগ ---- */
    const cloudinaryConfig = {
      cloudName: "dak8rgroe",
      uploadPreset: "portfolio",
    };

    /* ---- অথেনটিকেশন চেক ---- */
    function checkAuth() {
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          // লগইন না থাকলে লগইন পেজে রিডাইরেক্ট (প্রয়োজন অনুযায়ী টিউন করতে পারেন)
          // window.location.href = "login.html";
        }
      });
    }

    async function handleLogout() {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (e) {
        showToast("লগ আউট ব্যর্থ হয়েছে");
      }
    }

    /* ---- টোস্ট নোটিফিকেশন ---- */
    function showToast(text) {
      let stack = document.querySelector(".toast-stack");
      if (!stack) {
        stack = document.createElement("div");
        stack.className = "toast-stack";
        document.body.appendChild(stack);
      }
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = `<i data-lucide="check-circle-2" style="width:16px;height:16px;color:var(--success);"></i><span>${text}</span>`;
      stack.appendChild(el);
      lucide.createIcons();
      setTimeout(() => el.remove(), 3500);
    }
