<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>সম্পর্কে — পোর্টফোলিও</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
    :root {
      --bg-overlay: rgba(5, 5, 10, 0.55);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #f5f5f7;
      --text-faint: rgba(245, 245, 247, 0.65);
      --accent: #d4af37;
      --accent-soft: rgba(212, 175, 55, 0.25);
      --radius: 20px;
      --radius-sm: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url("bg.jpg") center/cover fixed no-repeat, #0a0a0f;
      padding: 84px 16px 100px;
    }
    a { color: inherit; text-decoration: none; }
    ::placeholder { color: var(--text-faint); }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
    }

    /* ---- টপবার ---- */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: rgba(10, 10, 15, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 50;
    }
    .topbar .brand {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-wrap {
      flex: 1;
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 14px;
    }
    .search-wrap input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .search-wrap i { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }

    /* ---- বটম ন্যাভ ---- */
    .bottom-nav {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 8px;
      z-index: 50;
      width: min(420px, calc(100% - 24px));
    }
    .bottom-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      color: var(--text-faint);
      transition: background 0.15s, color 0.15s;
    }
    .bottom-nav a i { width: 20px; height: 20px; }
    .bottom-nav a.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .container { max-width: 720px; margin: 0 auto; }

    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--glass-border);
      box-shadow: 0 0 0 6px var(--accent-soft);
      display: block;
      margin: 0 auto 16px;
    }

    .card {
      padding: 18px;
      margin-bottom: 14px;
    }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .card p { margin: 0; color: var(--text-faint); font-size: 13.5px; line-height: 1.6; }
    .cover {
      width: 100%; height: 150px; object-fit: cover;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      border: 1px solid var(--glass-border);
    }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      color: var(--text-faint);
    }
    .badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    h1.hero-title { text-align: center; font-size: 24px; margin: 4px 0 4px; }
    p.hero-tagline { text-align: center; color: var(--text-faint); margin: 0 0 20px; font-size: 14px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-accent {
      background: var(--accent);
      color: #1a1400;
      border-color: var(--accent);
    }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

    .social-row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .social-row a {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
    }
    .social-row a i { width: 18px; height: 18px; }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    label { font-size: 12px; color: var(--text-faint); display: block; margin-bottom: 6px; }

    .empty-state { text-align: center; padding: 40px 12px; color: var(--text-faint); }

    .star-row { display: flex; gap: 4px; margin: 6px 0; }
    .star-row i { width: 15px; height: 15px; color: var(--accent); }

    section.block { margin-bottom: 28px; }
    section.block h2 {
      font-size: 15px;
      margin: 0 0 12px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ---- চ্যাট ---- */
    .chat-box { display: flex; flex-direction: column; height: 46vh; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
    .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
    .msg.me { align-self: flex-end; background: var(--accent); color: #1a1400; border-bottom-right-radius: 4px; }
    .msg.other { align-self: flex-start; background: var(--glass-strong); border-bottom-left-radius: 4px; }
    .chat-input-row { display: flex; gap: 8px; margin-top: 10px; }
    .chat-input-row input { margin-bottom: 0; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand" id="brandName">পোর্টফোলিও</div>
    <form class="search-wrap" id="searchForm">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" placeholder="খুঁজুন..." autocomplete="off" />
    </form>
  </div>

  <div class="container">
    <h1 class="hero-title">সম্পর্কে</h1>
    <div class="glass card" id="bioCard">
      <p id="bioText">লোড হচ্ছে...</p>
    </div>
    <div class="social-row" id="socialRow"></div>

    <section class="block" style="margin-top:28px;">
      <h2><i data-lucide="star" style="width:14px;height:14px;vertical-align:-2px;"></i> রিভিউ ও রেটিং</h2>
      <p class="hero-tagline" id="avgRatingLabel" style="text-align:left;"></p>

      <div class="glass card">
        <label>নাম</label>
        <input type="text" id="rateName" placeholder="আপনার নাম" />
        <label>রেটিং</label>
        <div class="star-row" id="starPicker">
          <i data-lucide="star" data-val="1"></i>
          <i data-lucide="star" data-val="2"></i>
          <i data-lucide="star" data-val="3"></i>
          <i data-lucide="star" data-val="4"></i>
          <i data-lucide="star" data-val="5"></i>
        </div>
        <label>মন্তব্য</label>
        <textarea id="rateComment" rows="2" placeholder="আপনার অভিজ্ঞতা লিখুন..."></textarea>
        <button class="btn btn-accent" id="rateSubmitBtn" style="width:100%;"><i data-lucide="send"></i> জমা দিন</button>
        <p id="rateStatus" style="text-align:center;font-size:12.5px;margin-top:8px;color:var(--text-faint);"></p>
      </div>

      <div id="ratingsList" style="margin-top:16px;"></div>
    </section>
  </div>

  <nav class="bottom-nav glass">
      <a href="home.html" class=""><i data-lucide="home"></i><span>হোম</span></a>
      <a href="project_p.html" class=""><i data-lucide="folder-kanban"></i><span>প্রজেক্ট</span></a>
      <a href="contract.html" class=""><i data-lucide="message-circle"></i><span>চ্যাট</span></a>
      <a href="blog_p.html" class=""><i data-lucide="file-text"></i><span>ব্লগ</span></a>
      <a href="more.html" class="active"><i data-lucide="more-horizontal"></i><span>মোর</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore, doc, getDoc, collection, addDoc, getDocs,
      query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBN6M3FTTvy6V2JmrqbiYOZyaOM88g5Rvc",
      authDomain: "test-pro-portfolio.firebaseapp.com",
      projectId: "test-pro-portfolio",
      storageBucket: "test-pro-portfolio.firebasestorage.app",
      messagingSenderId: "368597108521",
      appId: "1:368597108521:web:ea84f26576e757ee3c5938",
      measurementId: "G-70622PC5Q4",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    lucide.createIcons();

    /* ---- টপবারে siteTitle বসানো ---- */
    getDoc(doc(db, "settings", "site")).then((snap) => {
      if (snap.exists() && snap.data().siteTitle) {
        document.getElementById("brandName").textContent = snap.data().siteTitle;
      }
    }).catch(() => {});

    function escapeHtml(s = "") {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    /* ---- বায়ো ও সোশ্যাল ---- */
    try {
      const snap = await getDoc(doc(db, "settings", "site"));
      if (snap.exists()) {
        const s = snap.data();
        document.getElementById("bioText").textContent = s.bio || "কোনো তথ্য যোগ করা হয়নি।";
        const social = document.getElementById("socialRow");
        const links = [
          ["mail", s.email ? "mailto:" + s.email : null],
          ["facebook", s.facebook],
          ["linkedin", s.linkedin],
          ["github", s.github],
        ];
        links.forEach(([icon, url]) => {
          if (!url) return;
          const a = document.createElement("a");
          a.href = url; a.target = "_blank"; a.rel = "noopener";
          a.innerHTML = `<i data-lucide="${icon}"></i>`;
          social.appendChild(a);
        });
        lucide.createIcons();
      }
    } catch (err) { console.warn("বায়ো লোড ব্যর্থ:", err.message); }

    /* ---- স্টার পিকার ---- */
    let selectedStars = 0;
    const starIcons = document.querySelectorAll("#starPicker i");
    function paintStars(n) {
      starIcons.forEach((el) => {
        el.style.color = Number(el.dataset.val) <= n ? "var(--accent)" : "rgba(255,255,255,0.25)";
      });
    }
    paintStars(0);
    starIcons.forEach((el) => el.addEventListener("click", () => {
      selectedStars = Number(el.dataset.val);
      paintStars(selectedStars);
    }));

    /* ---- রেটিং সাবমিট ---- */
    document.getElementById("rateSubmitBtn").addEventListener("click", async () => {
      const name = document.getElementById("rateName").value.trim();
      const comment = document.getElementById("rateComment").value.trim();
      const status = document.getElementById("rateStatus");
      if (!name || !selectedStars) { status.textContent = "নাম আর রেটিং দিন"; return; }
      try {
        await addDoc(collection(db, "ratings"), {
          name, comment, stars: selectedStars, createdAt: serverTimestamp(),
        });
        status.textContent = "✓ ধন্যবাদ! রেটিং জমা হয়েছে";
        document.getElementById("rateName").value = "";
        document.getElementById("rateComment").value = "";
        selectedStars = 0; paintStars(0);
        loadRatings();
      } catch (err) {
        status.textContent = "জমা দেওয়া যায়নি: " + err.message;
      }
    });

    /* ---- রেটিং লিস্ট ---- */
    async function loadRatings() {
      const el = document.getElementById("ratingsList");
      try {
        const q = query(collection(db, "ratings"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        if (snap.empty) {
          el.innerHTML = `<p class="empty-state">এখনো কোনো রিভিউ নেই — প্রথম রিভিউটা আপনিই দিন!</p>`;
          document.getElementById("avgRatingLabel").textContent = "";
          return;
        }
        let total = 0;
        const cards = snap.docs.map((d) => {
          const r = d.data();
          total += r.stars || 0;
          const stars = "⭐".repeat(r.stars || 0);
          return `<div class="glass card">
            <div style="display:flex;justify-content:space-between;">
              <h3>${escapeHtml(r.name || "")}</h3>
              <span style="color:var(--accent);font-size:13px;">${stars}</span>
            </div>
            ${r.comment ? `<p>${escapeHtml(r.comment)}</p>` : ""}
          </div>`;
        }).join("");
        el.innerHTML = cards;
        document.getElementById("avgRatingLabel").textContent =
          `গড় রেটিং: ⭐ ${(total / snap.size).toFixed(1)} (${snap.size} রিভিউ)`;
      } catch (err) {
        el.innerHTML = `<p class="empty-state">রিভিউ লোড করা যায়নি: ${err.message}</p>`;
      }
    }
    loadRatings();

    /* ---- সার্চ — প্রজেক্ট পেজে রিডাইরেক্ট করে ---- */
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("searchInput").value.trim();
      if (q) window.location.href = "project_p.html?q=" + encodeURIComponent(q);
    });


    /* ---- এনালিটিক্স ট্র্যাকিং ---- */
    function getVisitorId() {
      let id = localStorage.getItem("visitor_id");
      if (!id) {
        id = "v_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem("visitor_id", id);
      }
      return id;
    }
    try {
      await addDoc(collection(db, "analytics_events"), {
        page: window.location.pathname,
        referrer: document.referrer || "",
        visitorId: getVisitorId(),
        ts: serverTimestamp(),
      });
    } catch (err) {
      console.warn("ভিজিট ট্র্যাক করা যায়নি:", err.message);
    }
  </script>
</body>
</html>
