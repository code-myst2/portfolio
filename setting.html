<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>সেটিংস — এডমিন প্যানেল</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ===== থিম টোকেন — Next.js স্টাইল ব্ল্যাক থিম ===== */
:root {
  --bg: #000000;
  --bg-elevated: #0a0a0a;
  --bg-card: #0d0d0d;
  --border: #232323;
  --border-soft: #1a1a1a;
  --text: #ededed;
  --text-muted: #8a8a8a;
  --accent: #3291ff;
  --success: #46c76b;
  --radius: 10px;
  --radius-lg: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  padding-bottom: 110px;
}

a { color: inherit; text-decoration: none; }

/* ===== টপবার ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-soft);
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .brand {
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar .brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

/* ===== কন্টেন্ট এরিয়া ===== */
.page {
  max-width: 600px;
  margin: 0 auto;
  padding: 32px 20px 40px;
}
.page-header h1 { font-size: 22px; font-weight: 600; margin: 0; }
.page-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

/* ===== কার্ড & ফর্ম ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-top: 20px;
}
label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
input, textarea {
  width: 100%;
  background: #0a0a0a;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13.5px;
  font-family: inherit;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
.field { margin-bottom: 16px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .field-row { grid-template-columns: 1fr; } }

/* ===== বাটন ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  padding: 9px 16px;
  border-radius: var(--radius);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
}
.btn-primary { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 600; }
.btn-primary:hover { background: #e4e4e4; }

/* ===== ফ্লোটিং ডক ন্যাভ ===== */
.dock-wrap {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  padding: 0 10px;
  width: 100%;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.dock {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(15, 15, 15, 0.88);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 8px 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
}
.dock a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  color: var(--text-muted);
  transition: all .2s ease;
}
.dock a:hover { color: var(--text); background: rgba(255,255,255,0.08); }
.dock a.active { background: #ffffff; color: #000000; }
.dock a svg { width: 19px; height: 19px; }

/* ===== টোস্ট ===== */
.toast-stack { position: fixed; bottom: 100px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #fff; color: #000; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> এডমিন প্যানেল</div>
    <div class="actions">
      <button class="btn" id="logoutBtn"><i data-lucide="log-out" style="width:14px;height:14px;"></i> লগ আউট</button>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <h1>সেটিংস</h1>
      <p class="page-sub">সাইটের মূল তথ্য এডিট করুন</p>
    </div>

    <div class="card" id="settingsForm">
      <div class="field"><label>সাইটের নাম</label><input id="siteTitle" placeholder="আপনার পোর্টফোলিও নাম" /></div>
      <div class="field"><label>ট্যাগলাইন</label><input id="tagline" placeholder="যেমন: Full Stack Developer" /></div>
      <div class="field"><label>সংক্ষিপ্ত পরিচিতি</label><textarea id="bio" placeholder="নিজের সম্পর্কে সংক্ষেপে লিখুন..."></textarea></div>
      <div class="field"><label>যোগাযোগের ইমেইল</label><input id="email" placeholder="example@mail.com" /></div>
      <div class="field-row">
        <div class="field"><label>ফেসবুক লিংক</label><input id="facebook" placeholder="https://facebook.com/..." /></div>
        <div class="field"><label>লিংকডইন লিংক</label><input id="linkedin" placeholder="https://linkedin.com/in/..." /></div>
      </div>
      <div class="field"><label>গিটহাব লিংক</label><input id="github" placeholder="https://github.com/..." /></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:8px;">
        <button class="btn btn-primary" id="saveBtn">সংরক্ষণ করুন</button>
        <span id="savedNote" style="display:none;color:var(--success);font-size:13px;font-weight:500;">✓ তথ্য সংরক্ষিত হয়েছে</span>
      </div>
    </div>
  </div>

  <div class="dock-wrap">
    <nav class="dock">
      <a href="admin.html"><i data-lucide="layout-dashboard"></i></a>
      <a href="blog.html"><i data-lucide="file-text"></i></a>
      <a href="project.html"><i data-lucide="folder-kanban"></i></a>
      <a href="inbox.html"><i data-lucide="message-square"></i></a>
      <a href="analysis.html"><i data-lucide="bar-chart-3"></i></a>
      <a href="setting.html" class="active"><i data-lucide="settings"></i></a>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBN6M3FTTvy6V2JmrqbiYOZyaOM88g5Rvc",
      authDomain: "test-pro-portfolio.firebaseapp.com",
      projectId: "test-pro-portfolio",
      storageBucket: "test-pro-portfolio.firebasestorage.app",
      messagingSenderId: "368597108521",
      appId: "1:368597108521:web:ea84f26576e757ee3c5938",
      measurementId: "G-70622PC5Q4",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // window.location.href = "login.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    lucide.createIcons();

    function showToast(text) {
      let stack = document.querySelector(".toast-stack");
      if (!stack) {
        stack = document.createElement("div");
        stack.className = "toast-stack";
        document.body.appendChild(stack);
      }
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = `<i data-lucide="check-circle-2" style="width:16px;height:16px;color:var(--success);"></i><span>${text}</span>`;
      stack.appendChild(el);
      lucide.createIcons();
      setTimeout(() => el.remove(), 3500);
    }

    const FIELDS = ["siteTitle", "tagline", "bio", "email", "facebook", "linkedin", "github"];
    const settingsRef = doc(db, "settings", "site");

    try {
      const snap = await getDoc(settingsRef);
      if (snap.exists()) {
        const data = snap.data();
        FIELDS.forEach((f) => {
          const el = document.getElementById(f);
          if (el) el.value = data[f] || "";
        });
      }
    } catch (err) {
      console.error(err);
      showToast("সেটিংস লোড করা যায়নি");
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "সংরক্ষণ হচ্ছে...";

      const payload = {};
      FIELDS.forEach((f) => {
        const el = document.getElementById(f);
        if (el) payload[f] = el.value.trim();
      });

      try {
        await setDoc(settingsRef, payload, { merge: true });
        const note = document.getElementById("savedNote");
        note.style.display = "inline";
        setTimeout(() => (note.style.display = "none"), 3500);
        showToast("সেটিংস সফলভাবে সংরক্ষিত হয়েছে");
      } catch (err) {
        showToast("সংরক্ষণ করা যায়নি: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "সংরক্ষণ করুন";
      }
    });
  </script>
</body>
</html>
